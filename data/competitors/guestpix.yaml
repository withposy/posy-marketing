name: GuestPix
slug: guestpix
site: https://guestpix.com
source: https://guestpix.com/wedding-pricing
checked: "2026-08-23"
summary: >-
  A QR-code gallery with long upload windows, digital invitations and RSVP
  built in. Packages are priced per gallery rather than per guest, and every
  tier advertises unlimited photos, videos and guests.
model: Priced per gallery
plans:
  - name: Classic
    price: "$49"
    uploads: "Unlimited photos and videos"
    guests: "Unlimited"
    storage: "12 months"
    window: "Uploads open 3 months"
  - name: Signature
    price: "$89"
    note: "their most popular"
    uploads: "Unlimited photos and videos"
    guests: "Unlimited"
    storage: "12 months"
    window: "Uploads open 12 months"
  - name: Signature Bundle
    price: "$119"
    note: "3 separate galleries"
    uploads: "Unlimited photos and videos"
    guests: "Unlimited"
    storage: "24 months"
    window: "Uploads open 24 months"
strengths:
  - Unlimited uploads on every package, including the cheapest one.
  - Digital invitations and RSVP are built in, so it can replace a second tool.
  - The Signature Bundle covers three separate galleries, which suits an
    engagement party, the wedding and a day-after brunch.
tradeoffs:
  - Prices are not shown on the main pricing page. You choose an event type
    first, and the figures load on a separate page.
  - The entry package closes uploads after three months.
  - Pricing does not flex down for a small wedding, so an intimate day pays
    the same as a large one.
