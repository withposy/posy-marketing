name: Kululu
slug: kululu
site: https://www.kululu.com
source: https://www.kululu.com/pricing
checked: "2026-08-23"
summary: >-
  A QR-code photo sharing app with a free tier and a live photo wall for
  displaying uploads during the event. Plans are priced by how many photos
  get uploaded, not by how many guests you invite.
model: Priced by upload count
plans:
  - name: Free
    price: "$0"
    uploads: "Up to 100 photos and videos"
    guests: "Unlimited"
    storage: "7 days"
    window: "Uploads open 24 hours"
  - name: Plus
    price: "$39"
    uploads: "Up to 500 photos and videos"
    guests: "Unlimited"
    storage: "3 months"
    window: "Uploads open 1 month"
  - name: Pro
    price: "$99"
    uploads: "Unlimited"
    guests: "Unlimited"
    storage: "12 months"
    window: "Uploads open 3 months"
strengths:
  - A live photo wall displays uploads on a screen during the event.
  - Guest numbers never affect the price, so a very large wedding on a small
    budget can use the free or Plus plan.
tradeoffs:
  - The two cheaper plans cap how many photos your guests can upload, at 100
    and 500. Unlimited uploads start at $99.
  - The free plan keeps uploads for 7 days and stays open for 24 hours.
  - Upload windows close 1 month after the event on Plus and 3 months on Pro.
