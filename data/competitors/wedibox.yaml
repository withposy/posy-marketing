name: Wedibox
slug: wedibox
site: https://www.wedibox.com
source: https://www.wedibox.com/pricing
checked: "2026-08-23"
summary: >-
  A one-time-payment gallery with a free tier, an embeddable widget for a
  wedding website you already have, and paid plans that add RSVP, seating and
  a live slideshow.
model: Priced by feature set
plans:
  - name: Free
    price: "$0"
    uploads: "50 guest photo uploads"
    guests: "Unlimited"
    storage: "Not published"
    window: "No card needed"
  - name: Embed
    price: "$29"
    note: "widget for your existing site"
    uploads: "Unlimited photo uploads"
    guests: "Unlimited"
    storage: "3 months"
    window: "Uploads open 3 months"
  - name: Wedding
    price: "$49"
    uploads: "Unlimited guest uploads"
    guests: "Unlimited"
    storage: "6 months"
    window: "Uploads open 6 months"
  - name: All-In-One
    price: "$79"
    uploads: "Unlimited guest uploads"
    guests: "Unlimited"
    storage: "12 months"
    window: "Uploads open 12 months"
strengths:
  - The Embed plan drops a gallery into a wedding website you have already
    built, rather than sending guests somewhere else.
  - RSVP, meal choices and seating come bundled into the top plan, so it can
    replace a separate planning tool.
tradeoffs:
  - The upload window is the thing to watch. It runs 3 months on Embed,
    6 on Wedding and 12 on All-In-One.
  - The free tier stops at 50 guest photo uploads.
  - Unlimited uploads and a full year of collecting only meet on the $79 plan.
